openapi: 3.1.0
info:
  title: Cocktail Ling - API
  version: 1.0.0
  description: Dokumentacja API projektu Cocktail King
servers:
  - url: http://localhost:8000
    description: Serwer lokalny

paths:
  /api/login:
    post:
      summary: Logowanie użytkownika
      description: Zaloguj użytkownika przy użyciu email i hasła. Tworzy sesję użytkownika.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: No login data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Invalid login or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/register:
    post:
      summary: Rejestracja użytkownika
      description: Rejestruje nowego użytkownika i jego szczegóły.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Podany adres email już istnieje | Podana nazwa użytkownika już istnieje'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

  /api/user:
    get:
      summary: Pobierz dane zalogowanego użytkownika
      description: Zwraca informacje o użytkowniku aktualnie zalogowanym w sesji.
      responses:
        '200':
          description: Dane użytkownika
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: User not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/logout:
    post:
      summary: Wylogowanie użytkownika
      description: Unieważnia aktualną sesję użytkownika i kończy jego zalogowanie.
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: No user is currently logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Session not found or already invalidated | Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/cocktails:
    get:
      summary: Pobierz listę wszystkich koktajli
      description: Zwraca listę wszystkich koktajli z bazy danych. Każdy obiekt zawiera tylko nazwę i nazwę pliku obrazka.
      responses:
        '200':
          description: Cocktail list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CocktailListItem'
        '404':
          description: No cocktails found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/cocktails/{name_of_drink}:
    get:
      summary: Pobierz szczegóły koktajlu
      description: Zwraca szczegółowe informacje o jednym koktajlu, łącznie ze składnikami i jednostkami miary.
      parameters:
        - name: name_of_drink
          in: path
          required: true
          description: Nazwa koktajlu w formacie przyjaznym dla adresu URL np. old-fashioned
          schema:
            type: string
      responses:
        '200':
          description: Cocktail details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CocktailDetails'
        '404':
          description: No cocktail found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: jan.kowalski@example.com
        password:
          type: string
          format: password
          example: tajnehaslo123

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          example: JohnSnow
        email:
          type: string
          format: email
          example: john.snow@example.com
        password:
          type: string
          format: password
          example: T@jneha$l*123
        name:
          type: string
          example: John
        surname:
          type: string
          example: Snow

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: JohnSnow
        email:
          type: string
          format: email
          example: john.snow@example.com
        name:
          type: string
          example: John
        surname:
          type: string
          example: Snow
        roles:
          type: array
          items:
            type: string
          example: ["ROLE_ADMIN", "ROLE_USER"]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Przykładowy tekst wiadomości

    ValidationErrors:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: Podany adres email już istnieje
            username: Podana nazwa użytkownika juź istnieje

    CocktailListItem:
      type: object
      properties:
        name:
          type: string
          example: Old Fashioned
        image:
          type: string
          example: old fashioned.jpeg

    CocktailDetails:
      type: object
      properties:
        id_cocktail:
          type: integer
          example: 1
        name:
          type: string
          example: Old Fashioned
        description:
          type: string
          example: Jest to jeden z najstarszych koktajli świata. Jego historia sięga początku XVIII wieku.
        fun_fact:
          type: string
          example: Koktajl prezydencki – Harry S. Truman i jego żona Bess byli wielkimi fanami Old Fashioned.
        image:
          type: string
          example: old fashioned.jpeg
        difficulty_level:
          type: integer
          example: 1
        preparation_instruction:
          type: string
          example: Pierwsze 3 składniki do szklanicy. Mieszamy dokładnie. Dodajemy lód i mieszamy ponownie.
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CocktailIngredient'

    CocktailIngredient:
      type: object
      properties:
        name:
          type: string
          example: Burbon
        quantity:
          type: integer
          example: 60
        unit:
          type: string
          example: ml

